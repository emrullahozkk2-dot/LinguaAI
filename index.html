<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>LinguaAI</title><style>*{box-sizing:border-box}body{background:#101827;color:white;font:16px system-ui;max-width:650px;margin:auto;padding:20px}h1{color:#93c5fd}section{background:#202d42;border-radius:18px;padding:16px;margin:14px 0}button,input,select,textarea{font:inherit;width:100%;padding:12px;margin:5px 0;border:0;border-radius:10px}button{background:#2563eb;color:white}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}td{padding:7px;border-bottom:1px solid #789}table{width:100%}small{color:#b8c8df}</style><h1>LinguaAI</h1><small>V0.3 • Web prototipi</small><section>Ana dil<select id="n"></select>Öğrenilen dil<select id="t"></select></section><nav id="nav"></nav><section id="main">Yükleniyor…</section><noscript>JavaScript gerekli.</noscript><script>
const $=id=>document.getElementById(id),m=$('main'),n=$('n'),t=$('t');
const langs={tr:'Türkçe',it:'İtalyanca',ku:'Kurmancî',ckb:'Soranî',en:'İngilizce',de:'Almanca',fr:'Fransızca',es:'İspanyolca',uz:'Özbekçe',ar:'Arapça',ru:'Rusça',zh:'Çince',ja:'Japonca',pt:'Portekizce',other:'Diğer'};
for(const el of [n,t])for(const [k,v] of Object.entries(langs))el.add(new Option(v,k));n.value='tr';t.value='it';
let data={};try{data=JSON.parse(localStorage.getItem('lingua03')||'{}')||{}}catch(e){}
const key=()=>n.value+'-'+t.value, cards=()=>data[key()]||(data[key()]=key()==='tr-it'?[{a:'il pacco',b:'paket',p:'📦'},{a:'il camion',b:'kamyon',p:'🚚'},{a:'il magazzino',b:'depo',p:'🏭'}]:[]);
function save(){try{localStorage.setItem('lingua03',JSON.stringify(data))}catch(e){alert('Kalıcı kayıt kullanılamıyor')}}
function el(tag,txt,parent=m){const x=document.createElement(tag);x.textContent=txt;parent.append(x);return x}function btn(txt,fn,parent=m){const b=el('button',txt,parent);b.onclick=fn;return b}function inp(txt){const x=el('input','');x.placeholder=txt;return x}function heading(s){m.replaceChildren();el('h2',s)}
function say(s){if(!window.speechSynthesis)return alert('Ses desteklenmiyor');let u=new SpeechSynthesisUtterance(s);u.lang=t.value;const vs=speechSynthesis.getVoices(),v=vs.find(v=>v.lang.toLowerCase().startsWith(t.value));if(v)u.voice=v;else if(vs.length)return alert('Bu dilde cihaz sesi yok');speechSynthesis.cancel();speechSynthesis.speak(u)}
function words(){heading('Kelimelerim');const a=inp('Öğrenilen dilde kelime ve artikel'),b=inp('Anlamı'),p=inp('Emoji / görsel simgesi');btn('Kaydet',()=>{if(!a.value.trim()||!b.value.trim())return alert('İki alanı doldur');cards().push({a:a.value.trim(),b:b.value.trim(),p:p.value});save();words()});for(const c of cards()){el('p',(c.p||'')+' '+c.a+' — '+c.b);btn('🔊 Dinle',()=>say(c.a))}}
let i=0;function quiz(){heading('Ezber testi');const cs=cards();if(!cs.length){el('p','Önce kelime ekle');return}const c=cs[i%cs.length],mode=i%4;let done=false;if(mode===2)btn('🔊 Dinle ve yaz',()=>say(c.a));else el('p',mode===0?c.b:mode===1?c.a:(c.p||c.b));const a=inp('Cevabın'),r=el('p','');btn('Kontrol et',()=>{if(done||!a.value.trim())return;done=true;const expected=mode===1?c.b:c.a,ok=a.value.trim().toLowerCase()===expected.toLowerCase();r.textContent=ok?'Doğru!':'Doğru cevap: '+expected;c[ok?'right':'wrong']=(c[ok?'right':'wrong']||0)+1;save()});btn('Sonraki',()=>{i++;quiz()})}
const verbs={lavorare:['lavoro lavori lavora lavoriamo lavorate lavorano','ho|hai|ha|abbiamo|avete|hanno','lavorerò lavorerai lavorerà lavoreremo lavorerete lavoreranno'],essere:['sono sei è siamo siete sono','sono|sei|è|siamo|siete|sono','sarò sarai sarà saremo sarete saranno'],avere:['ho hai ha abbiamo avete hanno','ho|hai|ha|abbiamo|avete|hanno','avrò avrai avrà avremo avrete avranno'],andare:['vado vai va andiamo andate vanno','sono|sei|è|siamo|siete|sono','andrò andrai andrà andremo andrete andranno']};function verb(){heading('Fiil çekimleri');if(t.value!=='it'){el('p','Hazır çekimler şimdilik İtalyanca.');return}const s=el('select','');for(const k of Object.keys(verbs))s.add(new Option(k,k));const out=el('div','');function draw(){out.replaceChildren();const k=s.value,v=verbs[k];for(let j=0;j<3;j++){el('h3',['Presente','Passato prossimo','Futuro semplice'][j],out);const forms=j===1?v[j].split('|').map((a,z)=>a+' '+({lavorare:'lavorato',avere:'avuto',essere:z<3?'stato/a':'stati/e',andare:z<3?'andato/a':'andati/e'}[k])):v[j].split(' ');const table=el('table','',out);forms.forEach((f,z)=>{const row=el('tr','',table);el('td',['io','tu','lui/lei','noi','voi','loro'][z],row);el('td',f,row)})}}s.onchange=draw;draw()}
const d={'İş':[['Dove devo mettere il pacco?','Paketi nereye koymalıyım?'],['Mettilo sul carrello.','Arabaya koy.']],'Hastane':[['Mi fa male la testa.','Başım ağrıyor.'],['Da quanto tempo?','Ne zamandan beri?']],'Kafe':[['Vorrei un caffè, per favore.','Bir kahve istiyorum, lütfen.'],['Subito!','Hemen!']]};function dialog(){heading('Diyaloglar');if(key()!=='tr-it'){el('p','Hazır diyaloglar şimdilik Türkçe–İtalyanca.');return}const s=el('select','');Object.keys(d).forEach(k=>s.add(new Option(k,k)));const out=el('div','');function draw(){out.replaceChildren();d[s.value].forEach(c=>{el('p',c.join(' — '),out);btn('🔊 Dinle',()=>say(c[0]),out)})}s.onchange=draw;draw()}
function lessons(){heading('A1–B2');const topics={A1:'Artikeller: il libro (kitap), la casa (ev), i libri (kitaplar), le case (evler).',A2:'Passato prossimo: avere veya essere + participio passato. Ho lavorato (çalıştım).',B1:'Condizionale: Vorrei un caffè (Bir kahve isterim).',B2:'Congiuntivo: Penso che sia importante (Önemli olduğunu düşünüyorum).'};if(key()!=='tr-it'){el('p','Hazır dersler şimdilik Türkçe–İtalyanca.');return}const s=el('select','');Object.keys(topics).forEach(k=>s.add(new Option(k,k)));const p=el('p',topics.A1);s.onchange=()=>p.textContent=topics[s.value];el('small','Örnek dersler, tam müfredat henüz yok.')}
function ai(){heading('AI öğretmen');el('p','Entegre AI henüz bağlı değil. Sorunu ChatGPT üzerinden sorabilirsin.');const q=el('textarea','');q.placeholder='Sorun';btn('ChatGPT’de sor',()=>window.open('https://chatgpt.com/?q='+encodeURIComponent(q.value),'_blank','noopener'))}
for(const [name,fn] of [['📚 Kelimeler',words],['🧠 Ezber testi',quiz],['🔤 Fiil çekimleri',verb],['💬 Diyaloglar',dialog],['🎓 A1–B2',lessons],['🤖 AI öğretmen',ai]])btn(name,fn,$('nav'));n.onchange=t.onchange=()=>{i=0;words()};words();
</script></html>
