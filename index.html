const curriculum={"A1":"Alfabe ve telaffuz|c ve g, e/i önünde yumuşar; ch ve gh sert sesi korur.|ciao; chi; gelato\nSelamlaşma|Resmî konuşmada Lei, samimi konuşmada tu kullanılır.|Buongiorno, come sta?\nÖzne zamirleri|io, tu, lui/lei, noi, voi, loro; özne çoğu zaman düşebilir.|Io lavoro. = Lavoro.\nBelirli artikeller|Eril il/lo/l', çoğul i/gli; dişil la/l', çoğul le.|il libro, lo zaino, gli amici\nBelirsiz artikeller|un, uno, una, un'; un' yalnız dişil sesli harf önünde.|un amico, un'amica\nİsimlerde cinsiyet ve çoğul|Genellikle -o → -i, -a → -e, -e → -i; istisnalar vardır.|libro/libri, casa/case\nSıfat uyumu|Sıfat isimle cinsiyet ve sayı bakımından uyum sağlar.|una macchina nuova\nEssere|Kimlik, durum ve yer bildirir.|Sono stanco. Siamo a casa.\nAvere|Sahiplik, yaş ve bazı fiziksel durumlar.|Ho trent'anni. Ho fame.\nPresente -are|Kök + o,i,a,iamo,ate,ano.|Parlo italiano.\nPresente -ere ve -ire|Kök + o,i,e,iamo,ete/ite,ono; bazı -ire fiilleri -isc alır.|Prendo il bus. Finisco il lavoro.\nDüzensiz fiiller|andare, fare, stare, venire gibi fiiller ezberlenir.|Vado al lavoro.\nOlumsuzluk|non çekimli fiilden önce gelir.|Non capisco.\nSoru kelimeleri|chi, che cosa, dove, quando, perché, come, quanto.|Dove lavori?\nSayılar ve saatler|Saatlerde è l'una, sono le due kullanılır.|Sono le otto.\nTarih ve günler|Günler ve aylar küçük harfle yazılır.|Oggi è lunedì.\nBasit edatlar|a şehir, in ülke veya bazı mekânlar, da kişi veya kaynak.|Vivo a Modena, in Italia.\nBirleşik edatlar|di, a, da, in, su belirli artikelle birleşir.|al lavoro, nel magazzino\nİyelik sıfatları|mio, tuo, suo, nostro, vostro, loro; isimle uyum.|la mia casa, mio padre\nİşaret sıfatları|questo yakın, quello uzak nesne için.|Questo libro è nuovo.\nC'è ve ci sono|Tekil varlık için c'è, çoğul için ci sono.|Ci sono due pacchi.\nModal fiiller|potere, dovere, volere + mastar.|Devo lavorare.\nDönüşlü fiiller|mi, ti, si, ci, vi, si + fiil.|Mi sveglio alle sette.\nDoğrudan nesne|Fiilin doğrudan etkilediği öğe; kimi, neyi sorularına cevap.|Compro una macchina.\nSıklık zarfları|sempre, spesso, qualche volta, mai.|Lavoro sempre.\nPiacere|Beğenilen şey özne olur; tekil piace, çoğul piacciono.|Mi piace il caffè.\nGünlük yaşam|Rutinleri presente ile anlat.|Mi alzo e faccio colazione.\nAile ve tanışma|Aile, yaş, meslek, ülke hakkında konuş.|Mia sorella vive in Italia.\nAlışveriş ve yemek|Miktar ve fiyat sor.|Quanto costa il pane?\nYol ve ulaşım|Yer ve yön sor.|Dov'è la stazione?\nİş ve sağlık|Basit ihtiyaçları ve belirtileri ifade et.|Mi fa male la testa.\nVurgu ve çift ünsüz|Çift ünsüzü daha uzun söyle; vurgu anlamı ayırabilir.|pala / palla\nMeslekler|Meslek isimleri essere ile çoğunlukla artikelsiz kullanılır.|Sono autista.\nRenkler|Renk sıfatları genellikle isimle uyumludur.|Due scatole rosse.\nEv ve mobilya|Evdeki nesneleri yer edatlarıyla tarif et.|Il tavolo è vicino alla porta.\nHava durumu|Fa caldo, fa freddo, piove gibi kişisiz ifadeler kullanılır.|Oggi piove.\nForm doldurma|Nome ad, cognome soyad, data di nascita doğum tarihidir.|Scrivi il tuo nome.\nYer zarfları|qui, lì, sopra, sotto, davanti, dietro.|Il pacco è qui.","A2":"Passato prossimo|avere/essere + geçmiş ortaç; essere ile özne uyumu.|Ho lavorato. Sono andata.\nDüzensiz ortaçlar|fare→fatto, leggere→letto, scrivere→scritto.|Ho scritto un messaggio.\nImperfetto|Geçmiş alışkanlık ve arka plan.|Da piccolo giocavo.\nGeçmiş zaman karşılaştırması|Imperfetto arka plan, passato prossimo tamamlanmış olay.|Dormivo quando hai chiamato.\nFuturo semplice|Gelecek plan ve tahmin; -ò,-ai,-à,-emo,-ete,-anno.|Domani lavorerò.\nDoğrudan nesne zamirleri|mi, ti, lo, la, ci, vi, li, le fiilden önce.|La compro.\nDolaylı nesne zamirleri|mi, ti, gli, le, ci, vi, gli; kime sorusu.|Gli scrivo.\nNe ve ci|ne miktar veya di ile ilgili öğeyi, ci yer veya a ile ilgili öğeyi karşılayabilir.|Ne voglio due. Ci vado.\nEmir kipi|tu/noi/voi için talimat ve öneri.|Aspetta! Andiamo!\nKarşılaştırma|più/meno ... di veya che; come/quanto eşitlik.|È più grande di me.\nÜstünlük|il più ve -issimo biçimleri.|È il più alto. È bellissimo.\nGerundio|stare + gerundio sürmekte olan eylem.|Sto studiando.\nBelirsiz sıfatlar|qualche + tekil; alcuni/e + çoğul.|Ho qualche domanda.\nMiktar artikelleri|del, della, dei, delle belirsiz miktar.|Vorrei del pane.\nBağlaçlar|perché, quindi, mentre, però ile cümle bağla.|Studio perché voglio imparare.\nKibar istek|vorrei, potrebbe ile nazik istek.|Potrebbe aiutarmi?\nİlgi zamiri che|Özne veya doğrudan nesneyi bağlar.|Il libro che leggo.\nSüre ve zaman|da devam eden süre; fa geçmişteki zaman.|Vivo qui da un anno.\nTelefon ve randevu|Randevu al, değiştir ve iptal et.|Vorrei fissare un appuntamento.\nGeçmiş deneyimler|Olayları sıralı anlat.|Ieri sono uscito e ho comprato il pane.\nVurgulu zamirler|me, te, lui, lei, noi, voi, loro edatlardan sonra kullanılır.|Vieni con me.\nSıra sayıları|primo, secondo, terzo isimle uyum gösterir.|Il secondo piano.\nKişisiz hava fiilleri|Piove ve nevica üçüncü tekil kullanılır.|Ieri pioveva.\nOlumsuz emir|Tu için non + mastar kullanılır.|Non parlare!\nBelirsiz zamirler|qualcuno, qualcosa, nessuno, niente.|Non vedo nessuno.\nÜnlem cümlesi|Che + isim veya sıfatla duygu ifade edilir.|Che bella giornata!\nKısa mesajlar|Sebep, saat ve istek içeren kısa mesaj yaz.|Arrivo tardi perché c'è traffico.","B1":"Condizionale presente|Kibar istek, öneri, varsayım.|Al tuo posto studierei.\nCondizionale passato|Geçmişte gerçekleşmeyen istek veya geçmişten gelecek.|Avrei voluto venire.\nTrapassato prossimo|Geçmişteki başka olaydan önce tamamlanan eylem.|Avevo già mangiato.\nFuturo anteriore|Gelecekte başka olaydan önce tamamlanacak eylem.|Quando avrò finito, uscirò.\nCongiuntivo presente|Düşünce, şüphe, dilek ve bazı bağlaçlar.|Penso che sia utile.\nCongiuntivo passato|Şüphe veya düşüncenin geçmiş eylemi.|Credo che abbia finito.\nCongiuntivo imperfetto|Geçmiş ana fiil veya varsayım.|Volevo che venissi.\nKoşul cümlesi|Gerçek koşul indicativo; varsayım se + congiuntivo imperfetto + condizionale.|Se avessi tempo, studierei.\nBirleşik zamirler|mi+lo→me lo, gli+lo→glielo.|Me lo dai?\nİlgi zamirleri|cui edatla; il quale ve uyumlu biçimleri.|La persona con cui lavoro.\nEdilgen yapı|essere + participio passato, özne uyumu.|Il pacco è stato consegnato.\nKişisiz si|Genel insan davranışı; si + üçüncü kişi.|Qui si parla italiano.\nDolaylı anlatım|Söylenen sözün kişi ve zamanını bağlama göre değiştir.|Ha detto che era stanco.\nMastar yapıları|prima di, dopo aver/essere, senza + mastar.|Prima di uscire, chiudi la porta.\nAmaç ve neden|affinché + congiuntivo; siccome neden bildirir.|Siccome piove, resto a casa.\nKarşıtlık|anche se + indicativo; benché + congiuntivo.|Benché sia tardi, studio.\nResmî yazışma|Hitap, amaç, talep, kapanış.|Gentile Signore, Le scrivo per...\nGörüş belirtme|secondo me, ritengo che, a mio avviso.|Secondo me è utile.\nMetin bütünlüğü|innanzitutto, inoltre, infine ile yapı kur.|Inoltre, vorrei aggiungere...\nİş görüşmesi|Deneyim, beceri ve hedef anlat.|Ho esperienza nella logistica.\nHitap zamirleri|Resmî Lei ile üçüncü tekil fiil kullanılır.|Le posso chiedere una cosa?\nYargı ve şüphe zarfları|forse, probabilmente, certamente cümlenin kesinliğini değiştirir.|Forse arriverà domani.\nMastar geçmişi|avere/essere + participio önceki olayı ifade eder.|Dice di aver capito.\nBağlı seçenekler|o...o, né...né, sia...sia seçenekleri bağlar.|Parlo sia italiano sia turco.\nSonuç cümleleri|così/tanto...che sonuç bildirir.|Era così stanco che si addormentò.","B2":"Congiuntivo trapassato|avessi/fossi + participio; geçmişteki varsayım.|Pensavo che fosse partito.\nGeçmiş koşul|se + congiuntivo trapassato, condizionale passato.|Se avessi studiato, avrei superato l'esame.\nKarma koşullar|Geçmiş koşulun şimdiki sonucu.|Se avessi studiato, ora saprei di più.\nZaman uyumu|Ana fiilin zamanı ve yan cümlenin öncelik/eşzamanlılık ilişkisi.|Credevo che avesse finito.\nPassato remoto|Özellikle tarih ve edebiyatta tamamlanmış geçmiş.|Dante nacque nel 1265.\nTrapassato remoto|Edebî anlatıda passato remoto öncesi olay.|Dopo che ebbe finito, uscì.\nİleri edilgen|venire + participio basit zamanlarda; andare + participio gereklilik.|Il modulo va compilato.\nSi passivante|Fiil nesneyle sayı uyumu gösterir.|Si vendono auto.\nCausativo|fare/lasciare + mastar.|Faccio riparare la macchina.\nİleri zamirler|ce ne, gliene, birleşik zamir ve ortaç uyumu.|Gliene ho parlato.\nİleri gerundio|Neden, tarz, zaman; özne ilişkisine dikkat.|Avendo finito, uscì.\nİleri bağlaçlar|purché, a meno che, nonostante + congiuntivo.|Vengo purché tu sia libero.\nDolaylı soru|Soru yan cümlesi; kip bağlama göre değişir.|Mi chiedo se sia vero.\nVarsayım ve olasılık|Futuro ve condizionale tahmin veya aktarım bildirir.|Saranno le otto.\nSözcük türetme|Önek, sonek ve sözcük ailesi.|utile, inutile, utilità\nDeyimler ve kalıplar|Anlamı tek tek sözcüklerden çıkmayan ifadeler.|In bocca al lupo!\nResmî ve samimi üslup|Muhataba uygun sözcük ve hitap seç.|Le sarei grato se...\nTartışma ve argüman|Tez, gerekçe, karşı görüş, sonuç.|Da un lato..., dall'altro...\nÖzetleme|Ana düşünceyi koruyarak kendi sözlerinle aktar.|In sintesi...\nAkademik ve mesleki okuma|İddia, kanıt, çıkarım ve ton ayırt et.|Il testo sostiene che...\nFiil kalıpları|stare per, iniziare a, smettere di farklı eylem aşamalarını anlatır.|Sto per uscire.\nPronominal fiiller|farcela, andarsene, cavarsela kalıp olarak öğrenilir.|Ce la faccio.\nİsimleştirme|Fiil veya sıfat isimle ifade edilir.|La consegna del pacco.\nSınırlama ve istisna|tranne, eccetto, per quanto riguarda ile kapsam belirt.|Tutti sono venuti tranne Luca.\nAra cümleler|Ana cümleye ek bilgi verir.|Luca, a quanto pare, arriverà.\nKatılımcı biçimleri|Participio sıfat veya yan cümle işlevi üstlenebilir.|Terminato il lavoro, uscì."};const deepLessons={"Alfabe ve telaffuz":["İtalyanca temel alfabe 21 harften oluşur: A B C D E F G H I L M N O P Q R S T U V Z. J K W X Y yabancı kökenli kelimelerde de görülür.","C + a/o/u = k; c + e/i = ç; ch + e/i = k. G + a/o/u sert g; g + e/i yaklaşık c; gh + e/i sert g. H tek başına okunmaz. GN yaklaşık ny, GLI yaklaşık ly, SC + e/i ş sesidir.","casa — ev; cena — akşam yemeği; chi — kim; gatto — kedi; gelato — dondurma; spaghetti — makarna; bagno — banyo; scuola — okul","Hangi kelimede c, k gibi okunur?","casa","cena","ciao"],"Selamlaşma":["Sabah ve gündüz buongiorno, akşam buonasera kullanılır. Ciao samimidir; ayrılırken arrivederci denir.","Come stai? samimi; Come sta? resmî. Bene, grazie cevabı iyiyim, teşekkürler demektir.","Ciao, come stai? — Merhaba, nasılsın?; Buongiorno, come sta? — Günaydın, nasılsınız?; A domani! — Yarın görüşürüz!","Resmî olarak nasılsınız nasıl sorulur?","Come sta?","Come stai?","A domani!"],"Belirli artikeller":["İsimden önce belirli, bilinen varlığı gösterir. Türkçede birebir artikel karşılığı yoktur.","Eril: il + çoğu ünsüz, lo + s ve ünsüz, z, gn, ps gibi başlangıçlar, l' + sesli. Çoğul i veya gli. Dişil la, l', çoğul le.","il libro — kitap; lo zaino — sırt çantası; l'amico — arkadaş; la casa — ev; gli studenti — öğrenciler; le case — evler","Zaino için doğru artikel hangisi?","lo","il","la"],"Belirsiz artikeller":["Bir nesneyi ilk kez tanıtırken kullanılır.","Eril un veya uno; dişil una veya un'. Eril sesli önünde kesme işareti yoktur.","un libro — bir kitap; uno studente — bir öğrenci; un amico — bir erkek arkadaş; un'amica — bir kadın arkadaş","Amica için doğru artikel?","un'","un","uno"],"Günlük yaşam":["Günlük alışkanlıkları presente ile anlatırız. Önce özne, ardından çekimli fiil ve gerekiyorsa nesne gelir.","Dönüşlü fiillerde mi/ti/si kullanılır. Saat belirtmek için alle kullanılır; all'una tek istisnadır.","Mi sveglio alle sette. — Saat yedide uyanırım.; Faccio colazione. — Kahvaltı yaparım.; Vado al lavoro. — İşe giderim.; Torno a casa alle sei. — Saat altıda eve dönerim.","İşe giderim nasıl söylenir?","Vado al lavoro.","Sono al lavoro.","Torno a casa."],"İş ve sağlık":["İşyerinde görev sormak için devo + mastar; sağlıkta mi fa male + tekil vücut bölgesi kullanılır.","Çoğul vücut bölgesinde mi fanno male kullanılır. Kibar yardım talebi Può aiutarmi? şeklindedir.","Dove devo mettere il pacco? — Paketi nereye koymalıyım?; Mi fa male la testa. — Başım ağrıyor.; Mi fanno male le gambe. — Bacaklarım ağrıyor.","Başım ağrıyor nasıl söylenir?","Mi fa male la testa.","Mi fanno male le gambe.","Ho fame."],"Essere":["Kimlik, meslek, durum ve konum için kullanılır. Türkçedeki olmak fiiline karşılık gelir.","io sono, tu sei, lui/lei è, noi siamo, voi siete, loro sono. Olumsuzluk non ile yapılır.","Sono autista. — Şoförüm.; Sei stanco? — Yorgun musun?; Siamo in Italia. — İtalya'dayız.","Noi ... in Italia.","siamo","sono","siete"],"Avere":["Sahiplik, yaş, açlık ve susuzluk ifadelerinde kullanılır.","io ho, tu hai, lui/lei ha, noi abbiamo, voi avete, loro hanno. H okunmaz.","Ho fame. — Açım.; Hai una macchina? — Araban var mı?; Abbiamo tempo. — Vaktimiz var.","Io ... fame.","ho","sono","hai"],"Passato prossimo":["Tamamlanmış geçmiş olayları anlatır.","Avere veya essere şimdiki zaman çekimi + participio passato. Düzenli ortaçlar -ato/-uto/-ito. Essere ile cinsiyet ve sayı uyumu gerekir.","Ho mangiato. — Yemek yedim.; Sono arrivata. — Geldim (kadın).; Abbiamo lavorato. — Çalıştık.","Io ... lavorato.","ho","sono","ha"],"Condizionale presente":["Kibar istek, tavsiye ve varsayımsal sonuç bildirir.","Gelecek zaman kökü + ei, esti, ebbe, emmo, este, ebbero. Düzensiz kökler korunur.","Vorrei un caffè. — Bir kahve isterim.; Al tuo posto studierei. — Yerinde olsam çalışırdım.","Kibar kahve isteği hangisi?","Vorrei un caffè.","Ho un caffè.","Bevo un caffè."],"Congiuntivo trapassato":["Geçmişteki bir düşünce veya varsayımdan daha önce gerçekleşen eylemi anlatır.","Avere/essere congiuntivo imperfetto + participio passato. Örneğin avessi parlato, fossi arrivato.","Pensavo che fosse partito. — Ayrılmış olduğunu düşünüyordum.; Se avessi studiato, avrei superato l'esame. — Çalışmış olsaydım sınavı geçerdim.","Se ... studiato, avrei superato l'esame.","avessi","ho","avrò"]};function lessons(){heading('A1–B2 Eğitim merkezi');if(key()!=='tr-it'){el('p','Hazır dersler Türkçe–İtalyanca içindir.');return}const s=el('select','');Object.keys(curriculum).forEach(k=>s.add(new Option(k,k)));const out=el('div','');function draw(){out.replaceChildren();const rows=curriculum[s.value].split('\n');el('p',rows.length+' konu • Bir konuya dokun',out);rows.forEach((line,i)=>{const [name,rule,example]=line.split('|');btn((i+1)+'. '+name,()=>openLesson(name,rule,example),out)})}function openLesson(name,rule,example){out.replaceChildren();btn('← Konulara dön',draw,out);el('h2',name,out);const d=deepLessons[name];el('h3','Konu anlatımı',out);el('p',d?d[0]:rule,out);if(d){el('h3','Kurallar',out);el('p',d[1],out)}el('h3','Örnekler',out);(d?d[2]:example).split(';').forEach(x=>{el('p',x.trim(),out);btn('🔊 Dinle',()=>say(x.split(' — ')[0].trim()),out)});if(d){el('h3','Konu testi',out);el('p',d[3],out);const feedback=el('p','',out);[d[4],d[5],d[6]].sort((a,b)=>a.localeCompare(b)).forEach(x=>btn(x,()=>feedback.textContent=x===d[4]?'Doğru!':'Tekrar dene. Doğru cevap: '+d[4],out))}else el('small','Bu konu henüz kısa anlatım içeriyor; ayrıntılı ders hazırlanmadı.',out);el('h3','Yazma alıştırması',out);el('p','Örneklerden yararlanarak kendi cümleni yaz.',out);const note=el('textarea','',out);note.placeholder='Cümlen';const nk='lesson:'+s.value+':'+name;try{note.value=localStorage.getItem(nk)||''}catch(e){}btn('Notu kaydet',()=>{try{localStorage.setItem(nk,note.value);alert('Kaydedildi')}catch(e){alert('Kayıt yapılamadı')}},out)}s.onchange=draw;draw()}

rf":"oggi:bugün|ieri:dün|domani:yarın|sempre:her zaman|mai:asla|spesso:sık sık|subito:hemen|adesso:şimdi|qui:burada|lì:orada|bene:iyi|male:kötü|molto:çok|poco:az|già:zaten|ancora:hâlâ|presto:erken|tardi:geç|insieme:birlikte|forse:belki","Bağlaç":"e:ve|o:veya|ma:ama|perché:çünkü / neden|quindi:bu nedenle|mentre:iken|se:eğer|anche se:olsa bile|quando:ne zaman|però:ancak|oppure:ya da|inoltre:ayrıca","Soru kelimesi":"chi:kim|che cosa:ne|dove:nerede|quando:ne zaman|come:nasıl|quanto:ne kadar|quale:hangi","Artikel":"il:belirli eril tekil|lo:belirli eril tekil özel başlangıç|la:belirli dişil tekil|i:belirli eril çoğul|gli:belirli eril çoğul özel başlangıç|le:belirli dişil çoğul|un:belirsiz eril|uno:belirsiz eril özel başlangıç|una:belirsiz dişil"};function flashcards(){heading('Hafıza kartları');if(key()!=='tr-it'){el('p','Hazır kartlar İtalyanca–Türkçe.');return}const all=Object.entries(flashVocab).flatMap(([cat,str])=>str.split('|').map(x=>{const [a,b]=x.split(':');return {a,b,cat}})).concat(Object.entries(trVerbs).map(([a,b])=>({a,b,cat:'Fiil'})),cards().map(c=>({...c,cat:'Kelimelerim'})));const deck=[...new Map(all.map(c=>[c.a+'|'+c.b,c])).values()];let stats={};try{stats=JSON.parse(localStorage.getItem('flashStatsIT')||'{}')}catch(e){}const persist=()=>localStorage.setItem('flashStatsIT',JSON.stringify(stats));const id=c=>c.a+'|'+c.b;const st=c=>stats[id(c)]||(stats[id(c)]={fav:false,right:0,wrong:0,due:0});const cat=el('select','');['Tümü',...new Set(deck.map(c=>c.cat))].forEach(x=>cat.add(new Option(x,x)));const mode=el('select','');['Kartlar','Favoriler','Favori testi','Tekrar zamanı gelenler','Tüm kelimeler testi'].forEach(x=>mode.add(new Option(x,x)));const out=el('div','');let pos=0,turn=0;function pool(){return deck.filter(c=>(cat.value==='Tümü'||c.cat===cat.value)&&(!['Favoriler','Favori testi'].includes(mode.value)||st(c).fav)&&(mode.value!=='Tekrar zamanı gelenler'||st(c).fav&&st(c).due<=Date.now()))}function draw(){out.replaceChildren();const cs=pool();el('p',deck.length+' kart • '+deck.filter(c=>st(c).fav).length+' ezberlenen • '+cs.length+' seçili',out);if(!cs.length){el('p','Bu bölümde kart yok. Önce kartları ezberlenenlere ekle.',out);return}const c=cs[pos%cs.length],s=st(c);el('small',c.cat+' · '+(pos%cs.length+1)+' / '+cs.length,out);let test=mode.value.includes('testi')||mode.value==='Tekrar zamanı gelenler';if(!test){let flipped=false;const face=el('h2',c.a,out);btn('Kartı çevir',()=>{flipped=!flipped;face.textContent=flipped?c.b:c.a},out);btn('🔊 İtalyanca dinle',()=>say(c.a),out);btn(s.fav?'★ Ezberlenenlerden çıkar':'☆ Ezberledim – favorilere ekle',()=>{s.fav=!s.fav;s.due=Date.now();persist();draw()},out);btn('Henüz öğrenmedim',()=>{s.fav=false;persist();pos++;draw()},out)}else{let kind=turn%4,reverse=kind===1,expected=reverse?c.b:c.a,done=false;el('h3',['Türkçeden İtalyancaya yaz','İtalyancadan Türkçeye yaz','Dinle ve yaz','Çoktan seçmeli'][kind],out);if(kind===2)btn('🔊 Dinle',()=>say(c.a),out);else el('h2',reverse?c.a:c.b,out);const feedback=el('p','',out);function check(v){if(done)return;done=true;const norm=x=>x.trim().toLocaleLowerCase().replace(/’/g,"'");const ok=norm(v)===norm(expected);s[ok?'right':'wrong']++;s.due=Date.now()+(ok?[1,3,7,14,30][Math.min(s.right-1,4)]*86400000:600000);persist();feedback.textContent=ok?'Doğru! '+c.a+' — '+c.b:'Doğru cevap: '+expected}if(kind===3){const opts=[expected,...deck.filter(x=>x.a!==expected).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.a)].sort(()=>Math.random()-.5);opts.forEach(x=>btn(x,()=>check(x),out))}else{const a=el('input','',out);a.placeholder='Cevabın';btn('Kontrol et',()=>check(a.value),out)}el('small','Doğru: '+s.right+' • Yanlış: '+s.wrong,out)}btn('Sonraki kart',()=>{pos++;turn++;draw()},out)}cat.onchange=mode.onchange=()=>{pos=0;turn=0;draw()};draw()}
function dailyLessons(){heading('Günlük Derslerim · 08:00–11:00');el('p','60 günlük İtalyanca programı. Ders metnini ve kelimelerini gün gün sakla.');let archive={};try{archive=JSON.parse(localStorage.getItem('dailyItalian')||'{}')}catch(e){}const day=el('select','');for(let i=1;i<=60;i++)day.add(new Option('Ders '+i,i));const out=el('div','');function draw(){out.replaceChildren();const k=day.value,d=archive[k]||{text:'',words:''};el('h3','Ders '+k,out);const note=el('textarea','',out);note.rows=8;note.placeholder='Sabah aldığın dersin tam metni';note.value=d.text;const w=el('textarea','',out);w.rows=8;w.placeholder='Her satıra bir kart: lavorare | çalışmak';w.value=d.words;btn('Dersi kaydet',()=>{archive[k]={text:note.value,words:w.value};localStorage.setItem('dailyItalian',JSON.stringify(archive));draw()},out);const list=w.value.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x.length===2&&x[0]&&x[1]);el('p',list.length+' ders kartı',out);btn('Ders kartlarını hafıza merkezine ekle',()=>{if(key()!=='tr-it')return alert('Önce Türkçe ve İtalyanca seç');const cs=cards();for(const [a,b] of list)if(!cs.some(c=>c.a===a&&c.b===b))cs.push({a,b,p:'',lesson:k});save();alert('Kartlar eklendi')},out);let i=0;const area=el('div','',out);function practice(){area.replaceChildren();if(!list.length)return;const [a,b]=list[i%list.length];let flipped=false;const face=el('h2',a,area);btn('Kartı çevir',()=>{flipped=!flipped;face.textContent=flipped?b:a},area);btn('Dinle',()=>say(a),area);const input=el('input','',area);input.placeholder='İtalyanca cevabı yaz';el('p','Türkçesi: '+b,area);const feedback=el('p','',area);btn('Kontrol et',()=>feedback.textContent=input.value.trim().toLowerCase()===a.toLowerCase()?'Doğru!':'Doğru cevap: '+a,area);btn('Sonraki',()=>{i++;practice()},area)}btn('Bu dersin kartlarıyla çalış',practice,out)}day.onchange=draw;draw()}
